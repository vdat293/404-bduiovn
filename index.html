<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Hệ thống đang bảo trì</title>
<meta name="description" content="Cổng thông tin sinh viên Trường Đại học Bình Dương đang được bảo trì. Vui lòng tra cứu thông tin tại https://sv.bdu.edu.vn/public/" />

<!-- Favicon: logo trường -->
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png" />
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />

<style>
  :root {
    --red: #ad171c;
    --red-dark: #8f1216;
    --red-soft: #fdf0f0;
    --line: #f0d4d3;
    --text: #212529;
    --muted: #6c757d;
    --shadow: 0 18px 50px rgba(173, 23, 28, 0.13);
  }

  * { box-sizing: border-box; }

  body {
    min-height: 100vh;
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    padding: clamp(20px, 5vw, 56px) clamp(16px, 4vw, 40px);
    font-family: Roboto, "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    color: var(--text);
    background:
      radial-gradient(1100px 520px at 50% -120px, rgba(173, 23, 28, 0.09), transparent 70%),
      linear-gradient(180deg, #ffffff 0%, var(--red-soft) 100%);
    background-attachment: fixed;
    line-height: 1.7;
  }

  /* ---------- Thẻ nội dung ---------- */
  .card {
    width: min(620px, 100%);
    background: #fff;
    border: 1px solid var(--line);
    border-top: 5px solid var(--red);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: clamp(28px, 5vw, 48px) clamp(22px, 5vw, 52px);
    text-align: center;
    animation: rise 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: none; }
  }

  .logo {
    width: clamp(88px, 20vw, 112px);
    height: auto;
    display: block;
    margin: 0 auto 6px;
    filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.16));
  }

  .school {
    margin: 0 0 20px;
    font-size: 0.82rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 5px 14px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--red-soft);
    color: var(--red);
    font-size: 0.76rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .badge svg { width: 14px; height: 14px; flex: none; }

  h1 {
    margin: 16px 0 18px;
    font-size: clamp(1.45rem, 4.2vw, 2rem);
    font-weight: 700;
    line-height: 1.3;
    color: var(--red);
    letter-spacing: -0.01em;
  }

  .lead {
    margin: 0 auto;
    max-width: 46ch;
    font-size: clamp(0.98rem, 1.4vw, 1.05rem);
    color: var(--text);
  }

  a.url {
    color: var(--red);
    font-weight: 500;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.93em;
    text-decoration: underline;
    text-underline-offset: 3px;
    word-break: break-all;
  }
  a.url:hover { color: var(--red-dark); }

  /* ---------- Nút ---------- */
  .actions {
    margin-top: 28px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 11px 22px;
    font: inherit;
    font-size: 0.92rem;
    font-weight: 500;
    border-radius: 8px;
    cursor: pointer;
    text-decoration: none;
    transition: background 0.18s ease, border-color 0.18s ease, transform 0.12s ease, box-shadow 0.18s ease;
  }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible { outline: 3px solid rgba(173, 23, 28, 0.35); outline-offset: 2px; }
  .btn svg { width: 17px; height: 17px; flex: none; }

  .btn--primary {
    color: #fff;
    background: var(--red);
    border: 1px solid var(--red-dark);
    box-shadow: 0 6px 16px rgba(173, 23, 28, 0.28);
  }
  .btn--primary:hover { background: var(--red-dark); }

  .btn--ghost {
    color: var(--red);
    background: #fff;
    border: 1px solid var(--line);
  }
  .btn--ghost:hover { border-color: var(--red); background: var(--red-soft); }

  /* ---------- Chân trang ---------- */
  .foot {
    font-size: 0.8rem;
    color: var(--muted);
    text-align: center;
  }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translate(-50%, 14px);
    padding: 11px 20px;
    border-radius: 8px;
    background: var(--red);
    color: #fff;
    font-size: 0.88rem;
    font-weight: 500;
    box-shadow: 0 10px 26px rgba(173, 23, 28, 0.4);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) {
    .card { animation: none; }
    .btn { transition: none; }
  }
</style>
</head>
<body>

<main class="card">
  <img class="logo" src="assets/logo.png" alt="Logo Trường Đại học Bình Dương" width="112" height="112" />
  <p class="school">Đại học Bình Dương</p>

  <span class="badge">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 11v2a1 1 0 0 0 1 1h3l4 3V7L7 10H4a1 1 0 0 0-1 1Z" />
      <path d="M15 8.5a4 4 0 0 1 0 7M18 6a7 7 0 0 1 0 12" />
    </svg>
    Thông báo
  </span>

  <h1>Hệ thống đang bảo trì</h1>

  <p class="lead">
    Nếu muốn tra cứu thông tin, vui lòng sử dụng
    <a class="url" href="https://sv.bdu.edu.vn/public/" target="_blank" rel="noopener">https://sv.bdu.edu.vn/public/</a>
    để tra cứu.
  </p>

  <div class="actions">
    <a class="btn btn--primary" href="https://sv.bdu.edu.vn/public/" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9" />
        <path d="M3 12h18M12 3c2.6 2.6 2.6 15.4 0 18M12 3C9.4 5.6 9.4 18.4 12 21" />
      </svg>
      Đến trang tra cứu
    </a>
    <button class="btn btn--ghost" type="button" id="copy">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="9" y="9" width="11" height="11" rx="2" />
        <path d="M5 15V5a2 2 0 0 1 2-2h8" />
      </svg>
      <span id="copy-text">Sao chép liên kết</span>
    </button>
  </div>
</main>

<p class="foot">Trang sẽ hoạt động lại trong thời gian sớm nhất · Đại học Bình Dương</p>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
  (function () {
    var URL = "https://sv.bdu.edu.vn/public/";
    var btn = document.getElementById("copy");
    var btnText = document.getElementById("copy-text");
    var toast = document.getElementById("toast");
    var timer;

    function say(msg) {
      toast.textContent = msg;
      toast.classList.add("show");
      clearTimeout(timer);
      timer = setTimeout(function () { toast.classList.remove("show"); }, 2600);
    }

    btn.addEventListener("click", function () {
      function fallback() {
        var tmp = document.createElement("input");
        tmp.value = URL;
        document.body.appendChild(tmp);
        tmp.select();
        var ok = false;
        try { ok = document.execCommand("copy"); } catch (e) {}
        document.body.removeChild(tmp);
        say(ok ? "Đã sao chép liên kết." : "Không sao chép được — vui lòng copy thủ công.");
      }

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(URL).then(
          function () {
            say("Đã sao chép liên kết.");
            btnText.textContent = "Đã sao chép";
            setTimeout(function () { btnText.textContent = "Sao chép liên kết"; }, 2000);
          },
          fallback
        );
      } else {
        fallback();
      }
    });
  })();
</script>

</body>
</html>
